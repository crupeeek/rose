<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>спасибо</title>
<meta name="description" content="Роза, написанная словом «спасибо»">
<meta name="theme-color" content="#05060a">
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    font: 12px/1 ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
    letter-spacing: .12em; color: rgba(255,255,255,.28); pointer-events: none;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Роза из слов «спасибо»" role="img"></canvas>
<div id="hint">нажми, чтобы вырастить заново</div>

<script>
/* Идея: роза целиком состоит из слова «спасибо».
   Вдохновлено ASCII-артом @jin_22ee, но код и геометрия написаны с нуля. */

const TXT = "спасибо";
const FONT = '"JetBrains Mono","DejaVu Sans Mono",Consolas,ui-monospace,monospace';
const BG = "#05060a";

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let w, h, dpr, U, fs, cx, gy, Hs;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  w = innerWidth; h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  U = Math.min(w / 700, h / 900);
  fs = Math.max(8, 12 * U);
  cx = w / 2; gy = h - 40 * U; Hs = 430 * U;
}
addEventListener("resize", resize); resize();

/* ---------- фон: медленно плывущие буквы ---------- */
const P = Array.from({ length: 80 }, () => ({
  x: Math.random(), y: Math.random(), v: .008 + Math.random() * .03,
  s: .6 + Math.random() * .9, c: TXT[Math.random() * 7 | 0],
  hue: Math.random() < .5 ? 340 : 210, p: Math.random() * 6.28
}));
function drawParticles(t) {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const p of P) {
    const y = (((p.y - t * p.v) % 1) + 1) % 1 * h;
    const x = p.x * w + Math.sin(t * .3 + p.p) * 10;
    ctx.font = `${Math.max(7, 9 * p.s * Math.max(U, .8))}px ${FONT}`;
    ctx.fillStyle = `hsla(${p.hue},60%,80%,${.12 + .12 * Math.sin(t * 1.5 + p.p)})`;
    ctx.fillText(p.c, x, y);
  }
}

/* ---------- один символ с поворотом и тёмным ободком ---------- */
function glyph(ch, x, y, a, fill) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.strokeText(ch, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(ch, 0, 0);
  ctx.restore();
}

/* ---------- стебель ---------- */
function stemPt(p, sway) {
  return [cx + Math.sin(p * 2.6) * 16 * U + sway * p * p, gy - Hs * p];
}
function drawStem(g, sway) {
  ctx.font = `700 ${fs}px ${FONT}`;
  const adv = fs * .62, steps = Math.floor(Hs * g / adv);
  for (let k = 0; k <= steps; k++) {
    const p = k * adv / Hs;
    const [x, y] = stemPt(p, sway), [x2, y2] = stemPt(p + .004, sway);
    const a = Math.atan2(y2 - y, x2 - x);
    const nx = -Math.sin(a), ny = Math.cos(a);
    for (let c = -1; c <= 1; c++) {
      const o = c * fs * .55 * lerp(1.2, .8, p);
      glyph(TXT[(k + c + 3) % 7], x + nx * o, y + ny * o, a,
        `hsl(${132 + c * 5},70%,${33 + p * 8 + (c === 0 ? 9 : 0)}%)`);
    }
  }
}

/* ---------- листья ---------- */
const LEAVES = [
  { p: .30, side: -1, len: 150, wd: 46, ang: .55 },
  { p: .52, side:  1, len: 135, wd: 42, ang: .50 },
  { p: .70, side: -1, len: 100, wd: 32, ang: .60 }
];
function drawLeaf(L, t, g, sway) {
  const gr = sm((g - L.p) / .2); if (gr <= 0) return;
  const [bx, by] = stemPt(L.p, sway);
  const dir = (L.side < 0 ? -(Math.PI - L.ang) : -L.ang) + Math.sin(t * 1.2 + L.p * 5) * .04;
  const ax = Math.cos(dir), ay = Math.sin(dir), px = -ay, py = ax;
  const len = L.len * U * gr, wmax = L.wd * U * gr;
  const adv = fs * .62, rowH = fs * .95;
  const m = Math.max(2, Math.floor(len / adv));
  ctx.font = `700 ${fs * .95}px ${FONT}`;
  let ang = dir; if (Math.cos(ang) < 0) ang += Math.PI;
  for (let k = 1; k <= m; k++) {
    const u = k / m;
    const wv = wmax * Math.pow(Math.sin(Math.PI * u), .85);
    const rows = Math.floor(wv / rowH);
    const mx = bx + ax * u * len, my = by + ay * u * len + u * u * len * .25;
    for (let v = -rows; v <= rows; v++) {
      const mid = 1 - Math.abs(v) / (rows + 1);
      glyph(TXT[(k + v + 7) % 7], mx + px * v * rowH, my + py * v * rowH, ang,
        `hsl(${138 - u * 10},68%,${27 + mid * 20 + u * 4}%)`);
    }
  }
}

/* ---------- цветок: кольца из слова «спасибо» ---------- */
function drawFlower(t, scale, b) {
  const Rm = 165 * U * scale;
  const N = Math.max(5, Math.floor(Rm / (fs * .92)));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let pass = 0; pass < 2; pass++) {            // 0 — задняя половина, 1 — передняя
    for (let q = 0; q < N; q++) {
      const i = pass === 0 ? N - 1 - q : q;         // задние: снаружи внутрь; передние: изнутри наружу
      const s = (i + 1) / N, u = 1 - s;
      const bs = sm((b - u * .55) / .45);           // наружные лепестки раскрываются первыми
      const rb = Rm * .42 * Math.sqrt(Math.max(0, 1 - u * u * .98));
      const ro = Rm * (.10 + .90 * Math.pow(s, .9));
      const r = lerp(rb, ro, bs) + .001;
      const ht = lerp(Rm * .95 * u, Rm * .38 * u, bs);
      const tilt = lerp(.16, .52, bs);
      const yc = -ht - Rm * .06;
      const fsi = fs * (.8 + .3 * s);
      ctx.font = `700 ${fsi}px ${FONT}`;
      const n = Math.max(5, Math.round(2 * Math.PI * r / (fsi * .6)));
      const ph = i * .7 + Math.sin(t * .4 + i) * .03;
      for (let j = 0; j < n; j++) {
        const th = 2 * Math.PI * j / n + ph;
        const sn = Math.sin(th), cs = Math.cos(th);
        if ((pass === 0) !== (sn < 0)) continue;
        const sc = Math.cos(5 * th + i * .6);       // «фестоны» лепестков
        const rr = r * (1 + .1 * bs * sc);
        const x = rr * cs, y = yc + rr * sn * tilt;
        let a = Math.atan2(r * cs * tilt, -r * sn);
        if (Math.cos(a) < 0) a += Math.PI;
        const front = (sn + 1) / 2;
        let L = 22 + 26 * s + 10 * front + 3 * Math.sin(t * 2 + i + j * .4);
        if (bs > .3 && sc > .7) L += 7;
        glyph(TXT[(j + i * 3) % 7], x, y, a, `hsl(${352 + s * 6},88%,${clamp(L, 10, 72)}%)`);
      }
    }
  }
}

/* ---------- сцена ---------- */
let t0 = performance.now();
addEventListener("pointerdown", () => { t0 = performance.now(); });

function frame(now) {
  const t = (now - t0) / 1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
  ctx.lineJoin = "round"; ctx.strokeStyle = BG; ctx.lineWidth = fs * .3;

  drawParticles(t);

  const g = sm(t / 4.2);                    // рост стебля
  const bud = sm((t - 3.4) / 1.4);          // появление бутона
  const b = sm((t - 5) / 11);               // раскрытие
  const sway = Math.sin(t * .7) * 10 * U * g;

  // земля
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `${fs}px ${FONT}`; ctx.fillStyle = "rgba(255,255,255,.12)";
  ctx.fillText(TXT.repeat(Math.ceil(w * .5 / (fs * 4.2))).slice(0, Math.floor(w * .5 / (fs * .6))), cx, gy + fs * 1.4);

  drawStem(g, sway);
  for (const L of LEAVES) drawLeaf(L, t, g, sway);

  if (bud > 0) {
    const [tx, ty] = stemPt(1, sway), [x1, y1] = stemPt(.97, sway);
    const lean = Math.atan2(tx - x1, y1 - ty);
    if (b > 0) {                            // мягкое свечение
      const gr = ctx.createRadialGradient(tx, ty - 80 * U, 10, tx, ty - 80 * U, 260 * U);
      gr.addColorStop(0, `rgba(255,40,70,${.14 * b})`); gr.addColorStop(1, "rgba(255,40,70,0)");
      ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
    }
    ctx.save(); ctx.translate(tx, ty); ctx.rotate(lean);
    drawFlower(t, bud, b);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
